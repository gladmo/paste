[package]
name = "paste"
version = "0.1.0"
description = "Clipboard manager for macOS (Paste clone)"
authors = ["you"]
edition = "2021"

[lib]
name = "paste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "custom-protocol", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1", version = "2.1.0" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
ureq = "2"
core-graphics = { version = "0.25", features = ["elcapitan"] }
core-foundation = "0.10"
foreign-types = "0.5"
libc = "0.2"
objc2 = "0.6.1"
objc2-app-kit = "0.3.1"
objc2-foundation = "0.3"
base64 = "0.22"
log = "0.4"
