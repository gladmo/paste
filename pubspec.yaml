name: paste
description: A clipboard manager tool that quickly recalls clipboard history, supports text, images, and files.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  uuid: ^4.3.3
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  image: ^4.1.7
  super_clipboard: ^0.8.18
  window_manager: ^0.3.8
  hotkey_manager: ^0.2.3
  screen_retriever: ^0.1.9
  local_notifier: ^0.1.5
  url_launcher: ^6.2.6
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.6
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
