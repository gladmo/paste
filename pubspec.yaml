name: paste
description: A clipboard manager tool that quickly recalls clipboard history, supports text, images, and files.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  intl: ^0.19.0
  super_clipboard: ^0.8.18
  window_manager: ^0.3.8
  hotkey_manager: ^0.2.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
